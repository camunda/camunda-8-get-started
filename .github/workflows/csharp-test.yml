name: C# Integration tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  csharp-integration-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js (for c8ctl)
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install c8ctl
        run: npm install -g @camunda8/cli

      # Camunda.Orchestration.Sdk has no ephemeral-engine test harness yet
      # (unlike java/nodejs's camunda-process-test), so the tests need a
      # real running local cluster to drive the REST API against.
      - name: Start local Camunda 8 cluster
        run: |
          c8ctl cluster start
          c8ctl cluster status

      # Intentionally only .NET 9 (not 8): exercises the csproj's
      # <RollForward>LatestMajor</RollForward>, which exists so the example
      # runs on any "or later" SDK without the exact net8.0 runtime installed.
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "9.0.x"

      - name: Run tests
        run: dotnet test 2-order-process-with-service-workers/csharp/ProcessOrder.Tests

      - name: Stop local Camunda 8 cluster
        if: always()
        run: c8ctl cluster stop
